# ul-omo-webui 外链工具编排参考（cgit + filebrowser）
#
# 定位：参考件，不承担编排验收。docs/02 部署形态约定：主服务（ul-omo-webui
# 单二进制）不进容器、直接跑在宿主机；只有外链工具用 docker 编排。
# 路径分发由 Caddy 完成（见 Caddyfile.example），本文件只负责把两个外链
# 工具跑起来并接入同一 compose 网络。
#
# 用法：复制为 docker-compose.yml，按需删掉不要的服务（filebrowser 标为
# "按需"），`docker compose up -d`。镜像标签请自行核对后固定到具体版本。

services:
  # /git —— cgit（Git 历史浏览，纯看）。
  # cgit 本体需要配合 web 服务（fcgiwrap），社区常用镜像已打包好。
  # 挂载你想让用户浏览的仓库目录（示例挂法见下）。
  cgit:
    image: <cgit镜像按需固定版本>   # 例如 hub 上的 "clearlinux/cgit" 或自建；先核对该镜像的卷约定
    container_name: cgit
    restart: unless-stopped
    volumes:
      # 把宿主机仓库目录给 cgit 只读浏览；scan-path 指向这里（cgitrc 配置）
      - /path/to/your/repos:/srv/git:ro
    # cgit 的仓库扫描路径、标题等经 CGIT_CONFIG 环境变量或挂载 cgitrc 配置，
    # 具体以所选镜像文档为准——此文件不验证镜像行为，仅示意结构。
    networks:
      - webui-links

  # /files —— filebrowser（完整文件管理：上传/下载/重命名/在线编辑）。
  # 按需启用：不需要时整段注释掉，同时删掉 Caddyfile 里的 /files 分发块。
  # filebrowser 部署在 path 子路径下需要 --baseurl /files 参数。
  filebrowser:
    image: filebrowser/filebrowser:<版本按需固定>
    container_name: filebrowser
    restart: unless-stopped
    command: --baseurl /files
    volumes:
      - /path/to/your/workdir:/srv        # 浏览的根目录
      - ./filebrowser.db:/database.db     # filebrowser 自身状态（账号等）
    ports: []                              # 不直接暴露宿主端口，走 Caddy 分发
    networks:
      - webui-links

networks:
  webui-links:
    driver: bridge

# 说明：
# - 两个服务都不发布宿主端口，全部经 Caddy 的 /git /files 路径块转发
#   （Caddyfile.example 里写的是服务名 cgit:8080 / filebrowser:80）。
#   若 Caddy 不在本 compose 网络里，把这两个端口映射到宿主回环再由 Caddy
#   反代（如 "127.0.0.1:8081:8080"），并同步修改 Caddyfile 上游地址。
# - ul-omo-webui 主服务不在此文件中：它是单二进制直接跑（见 README 快速开始），
#   数据备份口径见 deploy/备份.md。
